spring:
  application:
    name: swipe-market-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/swipe_market?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:swipe_market_user}
    password: ${DB_PASSWORD:swipe_market_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: INFO
    org.springframework.web: INFO

# Configuración después de añadir dependencias en pom - I2
# Nota: Var local por sustituir en env vars.
jwt:
  secret: ${JWT_SECRET:VGhpc0lzQURldm9uc3RyYXRpb25TZWNyZXRLRXlGb3JTd2lwZU1hcmtldEFwcDEyMzQ1Njc4OTA=}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}